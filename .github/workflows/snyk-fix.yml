name: Snyk Fix PRs

on:
  schedule:
    # Runs daily at 8am UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  snyk-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run Snyk Fix
        id: snyk_fix
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk fix --file=requirements.txt || true

      - name: Create PR with fixes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: apply Snyk vulnerability fixes"
          title: "fix: Snyk auto-fix for vulnerable dependencies"
          body: |
            This PR was automatically created by the Snyk Fix workflow.

            Snyk identified vulnerable dependencies and applied available fixes
            to `requirements.txt`.

            Please review the changes and merge if appropriate.
          branch: snyk/auto-fix
          delete-branch: true
          labels: security,dependencies,automated
